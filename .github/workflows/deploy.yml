name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize vendor (private vv_mcp)
        run: |
          git clone --depth 1 \
            https://x-access-token:${{ secrets.VKUSVILL_LIST_TOKEN }}@github.com/averakt/vkusvill_list.git \
            vendor/vv_mcp && rm -rf vendor/vv_mcp/.git
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt ./vendor/vv_mcp
      - name: Run tests
        run: python -m pytest tests/ -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 "$USER@$HOST" \
            "cd /opt/bots/vkusvill && git pull --ff-only && docker compose up -d --build && sleep 6 && docker compose ps && docker compose logs --tail=5 bot"