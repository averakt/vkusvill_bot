name: vkusvill_bot

services:
  bot:
    build: .
    container_name: vkusvill_bot
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
    volumes:
      - bot_data:/data
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_data: